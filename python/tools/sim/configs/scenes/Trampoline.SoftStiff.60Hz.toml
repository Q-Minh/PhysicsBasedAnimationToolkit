#     Solver.Newton.LinearSolver.n_max_iters = 4000 (source 2000)
#     Solver.Newton.LinearSolver.rtol = 1e-09 (source 1e-06)
# - max_dist 50 cm, scaled to the metre-scale trampoline geometry (10 cm plate) and the sphere's impacts
