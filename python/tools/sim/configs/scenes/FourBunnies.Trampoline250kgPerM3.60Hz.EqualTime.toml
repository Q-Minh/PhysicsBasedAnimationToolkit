#   effective normal penalty is floored at h2 * min_sigma_n (h2 the substep's BetaTilde^2), 1 at h = 10 ms with
#   BDF1 like the former fixed floor of 1. The paper files' 1.0 is that former floor; read as a stiffness, it
#   would floor the penalty at 1e-4 at 10 ms.
#     Contact.ContactDynamics.min_sigma_n = 10000.0 (source 1.0)
# - Per-contact penalties (LocalMaxRayleighQuotient), the code default since 2026-11-06 (maintainer; the paper
#   files have the global one): one global penalty, set by the stiffest contact, also stiffened soft-side
#   contacts and slowed the sweeps. Global -> local, outer gradient ratio: Celebration median AAAVBD 40 -> 21,
#   Newton 302 -> 20; BasketOfFruit 2 s median/max AAAVBD 117/1241 -> 51/306, VBD 270/2462 -> 41/220;
#   DragonImpact impact p90/max AAAVBD 13.7/58.5 -> 6.3/15.0; CapsulesIntoBowl early exits 93% -> 100% and no
#   feasibility violations; others within noise. Median feasibility ratios rise 2-5x where contact matters,
#   staying below 1 (measurements: gpu/contact/dynamics.py, at adapt_penalty_parameters_to_hessian).
#     Contact.ContactDynamics.penalty_stiffness = 1 (source 0)
# - Stationarity tolerances rstol = 2e-2 and astol = 0.1, the code defaults since 2026-11-06 (maintainer; the
#   paper files' rstol 1e-2 and astol 0.5 had former meanings): the mass-weighted RMS of each node's residual
#   acceleration over the largest of rstol times its largest force per mass, astol times its own external
#   acceleration and its float32 floor must be at most 1. rstol: Trampoline.SoftSoft and CapsulesIntoBowl traces
#   gave the same pass points for 1e-2 to 1e-1. astol 0.1 (about 1 m/s^2): 2-4x closer to an early-exit-off
#   reference than 0.5 at h = 10 ms for 35-48% more sweeps, and no effect at h = 1 ms (gpu/vbd/convergence.py,
#   ConvergenceParams). The norm over nodes is the mass-weighted RMS (node_norm 0, the code default); the max
#   (1) is stricter, as single nodes at their float32 floor can hold a step (Trampoline.SoftSoft passed 0 of 421
#   steps under a max test). Residual smoothing in the test, smoothing_passes = 4 with smoothing_in_test = 1,
#   the code default for every scene since 2026-11-08 (maintainer): the test must also pass with the residual
#   and its float32 floor smoothed by 4 passes of 1-ring averaging. It rejects unconverged states that the
#   unsmoothed test passes through its floor clause (RMS_M(q0) > 1 but RMS_M(r) <= kg RMS_M(phi)), and it can
#   only remove passes. Screen (2026-11-08, one step per solver from a shared AAAVBD checkpoint at the scene
#   budget, early exit off; decisive ratio at k = 0 / k = 4 and mass-weighted RMS distance to the reference;
#   data/profiling/investigations/smoothing-screen): BendingBeam.100MPa Chebyshev 0.82 / 6.72, 0.43 mm from
