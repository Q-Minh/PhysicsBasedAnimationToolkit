# Scene config: MatOnStilts, every serialized parameter written out (diff it against configs/paper).
# For: final_scenes/mat_on_stilts_3.h5 (Young's modulus 1e6 to 1e8).
# Source: configs/paper/MatOnStilts.5Substeps.toml. Keys not listed below have the source's values.
# Generated 2026-11-08 by python/tools/sim/scene_configs.py; edit SCENES there, not this file.
#
# Differs from the source:
# - The maintainer's budget for stiff heterogeneous scenes: no substeps, 5 x 80 = 400 sweeps per step for every
#   VBD-family solver (the paper file gives 5 substeps of 5 x 5 = 125 sweeps; with them, EVD and
#   gammaup/gammaupS 0.9/0.85, AAAVBD blows up once the mat lands on the stilts. 10 x 20 and 10 x 40 were also
#   stable).
#     Integration.substeps = 1 (source 5)
#     Solver.AAAVBD.n_subproblem_max_iters = 80 (source 5)
#     Solver.AndersonSolver.n_subproblem_max_iters = 80 (source 5)
#     Solver.Chebyshev.n_subproblem_max_iters = 80 (source 5)
#     Solver.VBD.n_subproblem_max_iters = 80 (source 5)
# - Inverse vertex solve for the VBD family (maintainer: EVD only when singular vertex Hessians cause problems).
#     Solver.AAAVBD.vlinsolve = 0 (source 3)
#     Solver.AndersonSolver.vlinsolve = 0 (source 3)
#     Solver.Chebyshev.vlinsolve = 0 (source 3)
#     Solver.VBD.vlinsolve = 0 (source 3)
# - AAAVBD's shared parameter set, the same in every scene (gammadown/gammadownS 0.99/0.95, gammaup/gammaupS
#   0.5/0.3): the Lipschitz normalization is meant to make them problem-invariant.
#     Solver.AAAVBD.gammaup = 0.5 (source 0.8999999761581421)
#     Solver.AAAVBD.gammaupS = 0.3 (source 0.8500000238418579)
# - Adaptive contact penalty per time step (TIMESTEP, the code default; maintainer: CONSTANT only with a stated
#   justification), with the code's gamman_adaptive / gammaf_adaptive, instead of the paper's constant gamman.
#     Contact.ContactDynamics.penalty_adaptivity = 1 (source 0)
# - Positive AL contact margin dmin = 1 mm (the paper's -1e-4 dates from penetration-only VertexSdf detection):
#   resting vertices stay outside their partner, where the SDF sign is reliable, detection (below dmin + band)
#   starts before contact, and the feasibility tolerance (ftol * dmin) is meaningful.
#     Contact.ContactDynamics.dmin = 0.001 (source -9.999999747378752e-05)
# - VertexSdf band 2 mm, close to dmin (maintainer): a 2 cm band made the sphere stick to the trampolines under
#   Newton, and the 1 mm default once let bodies pass through 10 cm plates. max_dist is kept.
#     Contact.CDType.VertexSdf.band = 0.002 (source 0.001)
# - Newton on heterogeneous soft-stiff contact: 30 outer iterations (contact detection passes) x 1 Newton step,
#   with strict CG (rtol 1e-9, at most 4000 iterations) (maintainer, 2026-10-20): with 5 x 2 and the default CG,
#   the sphere's contact with the stiff trampoline center was unstable; 30 x 1 with strict CG is stable, if
#   slow.
#     Solver.Newton.n_max_iters = 30 (source 20)
#     Solver.Newton.LinearSolver.n_max_iters = 4000 (source 2000)
#     Solver.Newton.LinearSolver.rtol = 1e-09 (source 1e-06)
# - Contact penalty floor stiffness min_sigma_n = 1e4 N/m, the code default (maintainer, 2026-10-26): the
#   effective normal penalty is floored at h2 * min_sigma_n (h2 the substep's BetaTilde^2), 1 at h = 10 ms with
#   BDF1 like the former fixed floor of 1. The paper files' 1.0 is that former floor; read as a stiffness, it
#   would floor the penalty at 1e-4 at 10 ms.
#     Contact.ContactDynamics.min_sigma_n = 10000.0 (source 1.0)
# - Per-contact penalties (LocalMaxRayleighQuotient), the code default since 2026-11-06 (maintainer; the paper
#   files have the global one): one global penalty, set by the stiffest contact, also stiffened soft-side
#   contacts and slowed the sweeps. Global -> local, outer gradient ratio: Celebration median AAAVBD 40 -> 21,
#   Newton 302 -> 20; BasketOfFruit 2 s median/max AAAVBD 117/1241 -> 51/306, VBD 270/2462 -> 41/220;
#   DragonImpact impact p90/max AAAVBD 13.7/58.5 -> 6.3/15.0; CapsulesIntoBowl early exits 93% -> 100% and no
#   feasibility violations; others within noise. Median feasibility ratios rise 2-5x where contact matters,
#   staying below 1 (measurements: gpu/contact/dynamics.py, at adapt_penalty_parameters_to_hessian).
#     Contact.ContactDynamics.penalty_stiffness = 1 (source 0)
# - Stationarity tolerances rstol = 2e-2 and astol = 0.1, the code defaults since 2026-11-06 (maintainer; the
#   paper files' rstol 1e-2 and astol 0.5 had former meanings): the mass-weighted RMS of each node's residual
#   acceleration over the largest of rstol times its largest force per mass, astol times its own external
#   acceleration and its float32 floor must be at most 1. rstol: Trampoline.SoftSoft and CapsulesIntoBowl traces
#   gave the same pass points for 1e-2 to 1e-1. astol 0.1 (about 1 m/s^2): 2-4x closer to an early-exit-off
#   reference than 0.5 at h = 10 ms for 35-48% more sweeps, and no effect at h = 1 ms (gpu/vbd/convergence.py,
#   ConvergenceParams). The norm over nodes is the mass-weighted RMS (node_norm 0, the code default); the max
#   (1) is stricter, as single nodes at their float32 floor can hold a step (Trampoline.SoftSoft passed 0 of 421
#   steps under a max test). No residual smoothing (smoothing_passes 0, the code default, no extra work); k > 0
#   passes rank the solvers on stiff bodies at their float32 floor (Celebration) at a cost per test.
#     Solver.Convergence.astol = 0.1 (source 0.5)
#     Solver.Convergence.rstol = 0.02 (source 0.01)
# - Contact pair capacities sized for every surface vertex in contact at once, each with one partner (VertexSdf
#   gives a vertex at most one pair per other component): VF pairs for all of them, VE for half and VV for a
#   sixth, a closed triangle mesh's feature shares (V : E : F = 1 : 3 : 2, by Euler's formula with E = 3V and F
#   = 2V; the measured peaks were at most 39% VE and 7% VV pairs), and no EE pairs, which VertexSdf doesn't
#   detect (the storage keeps 1 slot) (maintainer, 2026-10-22: conservatively rather than minimally; dropped
#   pairs now warn).
#     Contact.ContactStorage.n_ee_contact_capacity = 0.0 (source 0.20000000298023224)
#     Contact.ContactStorage.n_ve_contact_capacity = 0.5 (source 0.05000000074505806)
#     Contact.ContactStorage.n_vf_contact_capacity = 1.0 (source 0.20000000298023224)
#     Contact.ContactStorage.n_vv_contact_capacity = 0.17 (source 0.05000000074505806)
#
# Not in the source, code defaults (configs/defaults.toml):
#   Contact.CDType.VertexSdf.freeze_within_solve
#   Contact.ContactDynamics.vbd_slack_at_evaluation
#   Solver.Convergence.early_exit
#   Solver.Convergence.floor_kappa
#   Solver.Convergence.floor_local_kappa
#   Solver.Convergence.node_norm
#   Solver.Convergence.smoothing_in_test
#   Solver.Convergence.smoothing_passes
#   Solver.Newton.early_exit
#   Solver.Newton.one_sided_contact
#
# Notes:
# - The paper's 10-substep file (MatOnStilts.10Substeps) differs from the 5-substep one only in substeps, which
#   this config overrides.

