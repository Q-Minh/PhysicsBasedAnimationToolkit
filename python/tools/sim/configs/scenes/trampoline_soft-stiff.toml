# The soft-stiff trampolines (Young's modulus 1e6 to 1e8) with the maintainer's settings for stiff heterogeneous scenes: no substeps, 5 x 80 = 400
# sweeps per step, the Inverse vertex solve, and AAAVBD gammaup/gammaupS 0.5/0.3 with
# gammadown/gammadownS 0.99/0.95. The paper file gives 5 substeps of 1 x 100 sweeps, with EVD and AAAVBD gammaup/gammaupS 0.9/0.85.
# Newton: 5 outer iterations x 2 Newton steps. The contact parameters are the paper file's, except for a
# positive AL contact margin dmin = 1 mm (the paper file's -1e-4 dates from penetration-only VertexSdf
# detection): resting vertices stay outside their partner, where the SDF sign is reliable, detection
# (below dmin + band) starts before contact, and the feasibility tolerance (ftol * dmin) is meaningful.
# The penalty is adaptive per time step (the code default, per the maintainer) instead of the paper
# file's constant gamman.
# Detection is scaled to the geometry (maintainer): the trampoline is 10 cm thick and the sphere 1.8 m
# across, so the default 1 mm band missed contacts and let sphere vertices reach the far side of the plate,
# whose contacts then pulled the sphere through. band = 2 cm and max_dist = 30 cm fix it.
extends = ["../paper/trampoline_soft-stiff.Params.5Substeps.toml"]

[Integration]
substeps = 1

[Contact.ContactDynamics]
dmin = 1e-3
penalty_adaptivity = 1  # TIMESTEP, with the code's gamman_adaptive / gammaf_adaptive

[Contact.CDType.VertexSdf]
band = 0.02  # 2 cm: these meshes are metre-scale (4 m x 10 cm plate, 1.8 m sphere, ~7 cm edges)
max_dist = 0.3

[Solver.AAAVBD]
n_max_iters = 5
n_subproblem_max_iters = 80
vlinsolve = 0
gammadown = 0.99
gammadownS = 0.95
gammaup = 0.5
gammaupS = 0.3

[Solver.VBD]
n_max_iters = 5
n_subproblem_max_iters = 80
vlinsolve = 0

[Solver.Chebyshev]
n_max_iters = 5
n_subproblem_max_iters = 80
vlinsolve = 0

[Solver.AndersonSolver]
n_max_iters = 5
n_subproblem_max_iters = 80
vlinsolve = 0

[Solver.Newton]
n_max_iters = 5  # outer iterations (contact detection passes); maintainer's guidance for contact scenes

[Solver.Newton.newton]
n_max_iters = 2  # Newton steps per outer iteration
