# Scene config: BasketOfFruit, every serialized parameter written out (diff it against configs/paper).
# For: final_scenes/basket_of_fruit.h5 (Young's modulus 1e5 to 1e8).
# Source: configs/paper/BasketOfFruit.toml. Keys not listed below have the source's values.
# Generated 2026-10-22 by python/tools/sim/scene_configs.py; edit SCENES there, not this file.
#
# Differs from the source:
# - The maintainer's budget for stiff heterogeneous scenes: no substeps, 5 x 80 = 400 sweeps per step for every
#   VBD-family solver (the paper file gives 3 substeps of 10 x 15 = 450 sweeps).
#     Integration.substeps = 1 (source 3)
#     Solver.AAAVBD.n_max_iters = 5 (source 10)
#     Solver.AAAVBD.n_subproblem_max_iters = 80 (source 15)
#     Solver.AndersonSolver.n_max_iters = 5 (source 10)
#     Solver.AndersonSolver.n_subproblem_max_iters = 80 (source 15)
#     Solver.Chebyshev.n_max_iters = 5 (source 10)
#     Solver.Chebyshev.n_subproblem_max_iters = 80 (source 15)
#     Solver.VBD.n_max_iters = 5 (source 10)
#     Solver.VBD.n_subproblem_max_iters = 80 (source 15)
# - Inverse vertex solve for the VBD family (maintainer: EVD only when singular vertex Hessians cause problems).
#     Solver.AAAVBD.vlinsolve = 0 (source 3)
#     Solver.AndersonSolver.vlinsolve = 0 (source 3)
#     Solver.Chebyshev.vlinsolve = 0 (source 3)
#     Solver.VBD.vlinsolve = 0 (source 3)
# - Adaptive contact penalty per time step (TIMESTEP, the code default; maintainer: CONSTANT only with a stated
#   justification), with the code's gamman_adaptive / gammaf_adaptive, instead of the paper's constant gamman.
#     Contact.ContactDynamics.penalty_adaptivity = 1 (source 0)
# - Positive AL contact margin dmin = 1 mm (the paper's -1e-4 dates from penetration-only VertexSdf detection):
#   resting vertices stay outside their partner, where the SDF sign is reliable, detection (below dmin + band)
#   starts before contact, and the feasibility tolerance (ftol * dmin) is meaningful.
#     Contact.ContactDynamics.dmin = 0.001 (source -9.999999747378752e-05)
# - VertexSdf band 2 mm, close to dmin (maintainer): a 2 cm band made the sphere stick to the trampolines under
#   Newton, and the 1 mm default once let bodies pass through 10 cm plates. max_dist is kept.
#     Contact.CDType.VertexSdf.band = 0.002 (source 0.001)
# - Newton on heterogeneous soft-stiff contact: 30 outer iterations (contact detection passes) x 1 Newton step,
#   with strict CG (rtol 1e-9, at most 4000 iterations) (maintainer, 2026-10-20): with 5 x 2 and the default CG,
#   the sphere's contact with the stiff trampoline center was unstable; 30 x 1 with strict CG is stable, if
#   slow.
#     Solver.Newton.n_max_iters = 30 (source 100)
#     Solver.Newton.LinearSolver.n_max_iters = 4000 (source 2000)
#     Solver.Newton.LinearSolver.rtol = 1e-09 (source 1e-06)
# - Contact pair capacities sized for every surface vertex in contact at once, each with one partner (VertexSdf
#   gives a vertex at most one pair per other component): VF pairs for all of them, VE for half and VV for a
#   sixth, a closed triangle mesh's feature shares (V : E : F = 1 : 3 : 2, by Euler's formula with E = 3V and F
#   = 2V; the measured peaks were at most 39% VE and 7% VV pairs), and no EE pairs, which VertexSdf doesn't
#   detect (the storage keeps 1 slot) (maintainer, 2026-10-22: conservatively rather than minimally; dropped
#   pairs now warn).
#     Contact.ContactStorage.n_ee_contact_capacity = 0.0 (source 0.20000000298023224)
#     Contact.ContactStorage.n_ve_contact_capacity = 0.5 (source 0.05000000074505806)
#     Contact.ContactStorage.n_vf_contact_capacity = 1.0 (source 0.20000000298023224)
#     Contact.ContactStorage.n_vv_contact_capacity = 0.17 (source 0.05000000074505806)

