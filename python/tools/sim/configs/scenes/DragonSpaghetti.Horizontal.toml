# Scene config: DragonSpaghetti.Horizontal, every serialized parameter written out (diff it against configs/paper).
# For: data/scenarios/dragon-spaghetti_horizontal.h5: kyogre-spaghetti_vertical.h5 with the Stanford dragon (data/stanford-dragon.ply tetrahedralized with fTetWild through pytetwild, edge length 0.025 of the bounding-box diagonal, envelope 5e-4: 204k tets, quality at least 0.057; data/stanford-dragon_ftetwild.msh) in place of the Kyogre, soft (Young's modulus 1e6), 2.26 m long, lying horizontally at mid-height near the twist axis (its head 0.37 m from it), with the pillars spread 1.2x from the axis (centers 1.2 m apart) so they clear it by at least 1 cm and close in on it from all sides (maintainer, 2026-10-21: the vertical dragon only caught one hand; aim for a highly tangled dragon).
# Source: configs/defaults.toml. Keys not listed below have the source's values.
# Generated 2026-10-22 by python/tools/sim/scene_configs.py; edit SCENES there, not this file.
#
# Differs from the source:
# - AAAVBD's shared parameter set, the same in every scene (gammadown/gammadownS 0.99/0.95, gammaup/gammaupS
#   0.5/0.3): the Lipschitz normalization is meant to make them problem-invariant.
#     Solver.AAAVBD.gammaupS = 0.3 (source 0.5)
# - Contact for the kyogre spaghetti scene (maintainer, 2026-10-21): VertexSdf max_dist 20 cm and band 5 mm, and
#   a 1 cm AL margin dmin. The scene file's floor and ceiling planes sit 2 cm from the pillars' ends, beyond the
#   detection distance dmin + band = 1.5 cm, so they report no contacts.
#     Contact.CDType.VertexSdf.band = 0.005 (source 0.001)
#     Contact.CDType.VertexSdf.max_dist = 0.2 (source 0.05)
#     Contact.ContactDynamics.dmin = 0.01 (source 0.002)
# - The maintainer's budget for the kyogre spaghetti scene (2026-10-21, tested with AAAVBD): no substeps, 5 x 80
#   = 400 sweeps per step for every VBD-family solver; Newton 20 x 2 with a tighter CG (rtol 1e-8, at most 4000
#   iterations), since the energy stiffens as the pillars tangle (maintainer).
#     Solver.AAAVBD.n_max_iters = 5 (source 1)
#     Solver.AAAVBD.n_subproblem_max_iters = 80 (source 100)
#     Solver.AndersonSolver.n_max_iters = 5 (source 1)
#     Solver.AndersonSolver.n_subproblem_max_iters = 80 (source 100)
#     Solver.Chebyshev.n_max_iters = 5 (source 1)
#     Solver.Chebyshev.n_subproblem_max_iters = 80 (source 100)
#     Solver.Newton.n_max_iters = 20 (source 1)
#     Solver.Newton.LinearSolver.n_max_iters = 4000 (source 2000)
#     Solver.Newton.LinearSolver.rtol = 1e-08 (source 1e-06)
#     Solver.Newton.newton.n_max_iters = 2 (source 10)
#     Solver.VBD.n_max_iters = 5 (source 1)
#     Solver.VBD.n_subproblem_max_iters = 80 (source 100)

