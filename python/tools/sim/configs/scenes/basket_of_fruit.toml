# basket_of_fruit (Young's modulus 1e5 to 1e8) with the maintainer's settings for stiff heterogeneous scenes: no substeps, 5 x 80 = 400
# sweeps per step, the Inverse vertex solve, and AAAVBD gammaup/gammaupS 0.5/0.3 with
# gammadown/gammadownS 0.99/0.95. The paper file gives 3 substeps of 10 x 15 = 150 sweeps, with EVD.
# Newton: 5 outer iterations x 2 Newton steps. The contact parameters are the paper file's, except for a
# positive AL contact margin dmin = 1 mm (the paper file's -1e-4 dates from penetration-only VertexSdf
# detection): resting vertices stay outside their partner, where the SDF sign is reliable, detection
# (below dmin + band) starts before contact, and the feasibility tolerance (ftol * dmin) is meaningful.
# The penalty is adaptive per time step (the code default, per the maintainer) instead of the paper
# file's constant gamman.
extends = ["../paper/basket_of_fruit.Params_3_10_15.toml"]

[Integration]
substeps = 1

[Contact.ContactDynamics]
dmin = 1e-3
penalty_adaptivity = 1  # TIMESTEP, with the code's gamman_adaptive / gammaf_adaptive

[Contact.CDType.VertexSdf]
band = 0.002  # 2 mm, close to dmin (maintainer)

[Solver.Convergence]
astol = 5e-4  # Young's modulus 1e8 regions resting in contact (the default is 1e-4)

[Solver.AAAVBD]
n_max_iters = 5
n_subproblem_max_iters = 80
vlinsolve = 0
gammadown = 0.99
gammadownS = 0.95
gammaup = 0.5
gammaupS = 0.3

[Solver.VBD]
n_max_iters = 5
n_subproblem_max_iters = 80
vlinsolve = 0

[Solver.Chebyshev]
n_max_iters = 5
n_subproblem_max_iters = 80
vlinsolve = 0

[Solver.AndersonSolver]
n_max_iters = 5
n_subproblem_max_iters = 80
vlinsolve = 0

[Solver.Newton]
n_max_iters = 5  # outer iterations (contact detection passes); maintainer's guidance for contact scenes

[Solver.Newton.newton]
n_max_iters = 2  # Newton steps per outer iteration
