# Scene config: ArmadilloSpaghetti.DragonImpact, every serialized parameter written out (diff it against configs/paper).
# For: data/scenarios/ArmadilloSpaghetti.DragonImpact.h5: ArmadilloSpaghetti.Fall (pose A, the armadillo's core released at 1.5 s) with the twist stopped at 4.0 s (720 deg per end; maintainer, 2026-10-24) and a Fixed transform on the pillars' turned end nodes over [0, 1000) s, which keeps the ends where the rotation stopped, plus two Stanford dragons (data/stanford-dragon_ftetwild.msh scaled to 1.5 m long, 51k nodes and 204k tets each, Young's modulus 1e7, Poisson's ratio 0.45, 1000 kg/m^3) parked left (-x) and right (+x) of the twist axis, both leading with the mesh's higher, narrower +x end (the right one turned 180 deg about z): the left one's at the armadillo's feet (z -0.60 m), the right one's at its shoulders (z +0.25 m), both at y 1.45 m and 1.1 and 1.3 m from the axis. Each is held by a Fixed transform over [0, 4.49) s and launched by a Translate over [4.49, 4.50) s at 5 m/s toward the axis plus the upward speed (0.62 and 0.89 m/s) that brings its leading end back to its launch height over the flight to the bodies' near side (0.13 and 0.18 s, aimed at the fall's frame at 4.49 s, its twist still on); released, it keeps that velocity. 1.40M tets in all.
# Source: configs/defaults.toml. Keys not listed below have the source's values.
# Generated 2026-10-24 by python/tools/sim/scene_configs.py; edit SCENES there, not this file.
#
# Differs from the source:
# - AAAVBD's shared parameter set, the same in every scene (gammadown/gammadownS 0.99/0.95, gammaup/gammaupS
#   0.5/0.3): the Lipschitz normalization is meant to make them problem-invariant.
#     Solver.AAAVBD.gammaupS = 0.3 (source 0.5)
# - Contact for the kyogre spaghetti scene (maintainer, 2026-10-21): VertexSdf max_dist 20 cm and band 5 mm, and
#   a 1 cm AL margin dmin. The scene file's floor and ceiling planes sit 2 cm from the pillars' ends, beyond the
#   detection distance dmin + band = 1.5 cm, so they report no contacts.
#     Contact.CDType.VertexSdf.band = 0.005 (source 0.001)
#     Contact.CDType.VertexSdf.max_dist = 0.2 (source 0.05)
#     Contact.ContactDynamics.dmin = 0.01 (source 0.002)
# - 10 substeps per 10 ms step for the dragons' impact on the armadillo spaghetti (maintainer, 2026-10-23), each
#   of 1 outer iteration x 100 sweeps for every VBD-family solver: at 5 substeps of 1 x 80 (the fall's budget),
#   the pillars jittered after the impact (mid-span RMS speed 0.8-2.2 m/s, velocity reversal 0.7-1.0, rejected
#   by the maintainer, against 0.35-0.55 m/s and 0.4-0.5 at 10 substeps, AAAVBD with the twist stopped at 5.0
#   s), and a thin feature at the left dragon's trailing end (375 nodes) settled into a flapping limit cycle
#   (about 8 Hz, 20 cm range, 4-5 m/s, with the twist stopped at 4.0 or 5.0 s) that decays at 10 substeps (2.4
#   to 0.14 m/s over 7 s, no 8 Hz component). Newton keeps the fall's 20 outer iterations per step, 2 per
#   substep with 2 Newton steps and CG rtol 1e-8, at most 4000 iterations; untested on this scene.
#     Integration.substeps = 10 (source 1)
#     Solver.Newton.n_max_iters = 2 (source 1)
#     Solver.Newton.LinearSolver.n_max_iters = 4000 (source 2000)
#     Solver.Newton.LinearSolver.rtol = 1e-08 (source 1e-06)
#     Solver.Newton.newton.n_max_iters = 2 (source 10)
# - Contact pair capacities sized for every surface vertex in contact at once, each with one partner (VertexSdf
#   gives a vertex at most one pair per other component): VF pairs for all of them, VE for half and VV for a
#   sixth, a closed triangle mesh's feature shares (V : E : F = 1 : 3 : 2, by Euler's formula with E = 3V and F
#   = 2V; the measured peaks were at most 39% VE and 7% VV pairs), and no EE pairs, which VertexSdf doesn't
#   detect (the storage keeps 1 slot) (maintainer, 2026-10-22: conservatively rather than minimally; dropped
#   pairs now warn).
#     Contact.ContactStorage.n_ee_contact_capacity = 0.0 (source 0.2)
#     Contact.ContactStorage.n_ve_contact_capacity = 0.5 (source 0.05)
#     Contact.ContactStorage.n_vf_contact_capacity = 1.0 (source 0.5)
#     Contact.ContactStorage.n_vv_contact_capacity = 0.17 (source 0.05)
#
# Notes:
# - Built from ArmadilloSpaghetti.Fall.h5 (left unchanged); the twist stop, the launch time and the aim are the
#   scene file's transform windows and velocities. Its variant with the twist stopped at 5.0 s and the launch at
#   5.49 s is data/scenarios/ArmadilloSpaghetti.DragonImpact.TwistStop5s.h5.
# - Why 4.0 s (AAAVBD, 2026-10-24): with the twist stopped at 5.0 s (10 substeps of 1 x 100), the armadillo kept
#   swinging (about 0.8 m/s RMS at 1.3 Hz, no decay from 8 to 20 s), and a cluster of inverted elements (about
#   19 within 20 cm of element 846743, which first inverts at about 3.8 s in the twist) released at about 18.9 s
#   (the armadillo dropped 9 cm, penetration ratio 4.1, nodes at 28 m/s). With the twist stopped at 4.0 s (5
#   substeps of 1 x 80, launch to 4 s after it), the cluster stayed at 1-2 inverted elements and the pillars
#   moved less (mid-span RMS 0.28-0.40 m/s, reversal 0.18-0.37).

[Contact.CDType.OGC]
