# Scene config: Celebration, every serialized parameter written out (diff it against configs/paper).
# For: final_scenes/celebration.h5 (Young's modulus 1e6 to 1e8).
# Source: configs/paper/Celebration.toml. Keys not listed below have the source's values.
# Generated 2026-11-01 by python/tools/sim/scene_configs.py; edit SCENES there, not this file.
#
# Differs from the source:
# - The maintainer's budget for stiff heterogeneous scenes: no substeps, 5 x 80 = 400 sweeps per step for every
#   VBD-family solver (the paper file gives 1 x 5 x 30 = 150 sweeps).
#     Solver.AAAVBD.n_subproblem_max_iters = 80 (source 30)
#     Solver.AndersonSolver.n_subproblem_max_iters = 80 (source 30)
#     Solver.Chebyshev.n_subproblem_max_iters = 80 (source 30)
#     Solver.VBD.n_subproblem_max_iters = 80 (source 30)
# - Inverse vertex solve for the VBD family (maintainer: EVD only when singular vertex Hessians cause problems).
#     Solver.AAAVBD.vlinsolve = 0 (source 3)
#     Solver.AndersonSolver.vlinsolve = 0 (source 3)
#     Solver.Chebyshev.vlinsolve = 0 (source 3)
#     Solver.VBD.vlinsolve = 0 (source 3)
# - Adaptive contact penalty per time step (TIMESTEP, the code default; maintainer: CONSTANT only with a stated
#   justification), with the code's gamman_adaptive / gammaf_adaptive, instead of the paper's constant gamman.
#     Contact.ContactDynamics.penalty_adaptivity = 1 (source 0)
# - Contact for the celebration scene (maintainer, 2026-11-01): a 5 mm AL margin dmin and a 3 mm VertexSdf band,
#   with the source's 5 cm max_dist (was 30 cm): 5 cm still covers any vertex inside the base plate (10.7 cm
#   thick) or a confetto (about 5 cm thick).
#     Contact.CDType.VertexSdf.band = 0.003 (source 0.001)
#     Contact.ContactDynamics.dmin = 0.005 (source -9.999999747378752e-05)
# - Contact penalty floor stiffness min_sigma_n = 1e4 N/m, the code default (maintainer, 2026-10-26): the
#   effective normal penalty is floored at h2 * min_sigma_n (h2 the substep's BetaTilde^2), 1 at h = 10 ms with
#   BDF1 like the former fixed floor of 1. The paper files' 1.0 is that former floor; read as a stiffness, it
#   would floor the penalty at 1e-4 at 10 ms.
#     Contact.ContactDynamics.min_sigma_n = 10000.0 (source 1.0)
# - Contact pair capacities sized for every surface vertex in contact at once, each with one partner (VertexSdf
#   gives a vertex at most one pair per other component): VF pairs for all of them, VE for half and VV for a
#   sixth, a closed triangle mesh's feature shares (V : E : F = 1 : 3 : 2, by Euler's formula with E = 3V and F
#   = 2V; the measured peaks were at most 39% VE and 7% VV pairs), and no EE pairs, which VertexSdf doesn't
#   detect (the storage keeps 1 slot) (maintainer, 2026-10-22: conservatively rather than minimally; dropped
#   pairs now warn).
#     Contact.ContactStorage.n_ee_contact_capacity = 0.0 (source 0.20000000298023224)
#     Contact.ContactStorage.n_ve_contact_capacity = 0.5 (source 0.05000000074505806)
#     Contact.ContactStorage.n_vf_contact_capacity = 1.0 (source 0.20000000298023224)
#     Contact.ContactStorage.n_vv_contact_capacity = 0.17 (source 0.05000000074505806)
# - Fixed compute budgets, no early exit for the VBD family (maintainer, 2026-11-01): the scene shows
#   qualitative differences between the solvers at equal compute. early_exit = 0 runs every solve's full budget,
#   Newton's included, while the usual tests still run and record their ratios (zero tolerances, used before,
#   made them infinite).
#     Solver.Convergence.early_exit = 0 (source 1)
# - Newton, the reference, at 5 outer iterations x 1 Newton step with the source's CG (rtol 1e-6, at most 2000
#   iterations) (maintainer, 2026-11-01): its gradient ratio plateaus after the second outer iteration (about 15
#   before contact, 125-170 during the confetti impacts), and on 6 impact steps 5 x 1 lands within its
#   run-to-run noise of 10 x 1 (confetti 4.9 mm RMS from it, against 4.1 mm between two identical 10 x 1 runs)
#   at half the cost, about 11 s per step; 3 x 1 penetrates (feasibility ratio 1.4) and 30 x 1 with strict CG
#   took 116 s per step.
#     Solver.Newton.n_max_iters = 5 (source 70)
#
# Not in the source, code defaults (configs/defaults.toml):
#   Solver.Convergence.early_exit

