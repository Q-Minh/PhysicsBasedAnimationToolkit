# Scene config: BendingBeam.10MPa, every serialized parameter written out (diff it against configs/paper).
# For: final_scenes/bending_beams/small_beamY1e7.h5 (homogeneous, Young's modulus 1e7).
# Source: configs/paper/BendingBeam.10MPa.GroundTruth.toml. Keys not listed below have the source's values.
# Generated 2026-11-06 by python/tools/sim/scene_configs.py; edit SCENES there, not this file.
#
# Differs from the source:
# - Inverse vertex solve for the VBD family (maintainer: EVD only when singular vertex Hessians cause problems).
#     Solver.AAAVBD.vlinsolve = 0 (source 3)
#     Solver.AndersonSolver.vlinsolve = 0 (source 3)
#     Solver.Chebyshev.vlinsolve = 0 (source 3)
#     Solver.VBD.vlinsolve = 0 (source 3)
# - Positive AL contact margin dmin = 1 mm (the paper's -1e-4 dates from penetration-only VertexSdf detection):
#   resting vertices stay outside their partner, where the SDF sign is reliable, detection (below dmin + band)
#   starts before contact, and the feasibility tolerance (ftol * dmin) is meaningful.
#     Contact.ContactDynamics.dmin = 0.001 (source -9.999999747378752e-05)
# - Stationarity tolerances rstol = 2e-2 and astol = 0.1, the code defaults since 2026-11-06 (maintainer; the
#   paper files' rstol 1e-2 and astol 0.5 had former meanings): the mass-weighted RMS of each node's residual
#   acceleration over the largest of rstol times its largest force per mass, astol |a| and its float32 floor
#   must be at most 1. rstol: Trampoline.SoftSoft and CapsulesIntoBowl traces gave the same pass points for 1e-2
#   to 1e-1. astol 0.1 (about 1 m/s^2): 2-4x closer to an early-exit-off reference than 0.5 at h = 10 ms for
#   35-48% more sweeps, and no effect at h = 1 ms (gpu/vbd/convergence.py, ConvergenceParams).
#     Solver.Convergence.astol = 0.1 (source 0.5)
#     Solver.Convergence.rstol = 0.02 (source 0.01)
#
# Not in the source, code defaults (configs/defaults.toml):
#   Contact.CDType.VertexSdf.freeze_within_solve
#   Contact.ContactDynamics.vbd_slack_at_evaluation
#   Solver.Convergence.early_exit
#   Solver.Convergence.floor_kappa
#   Solver.Convergence.floor_local_kappa
#   Solver.Newton.one_sided_contact
#
# Notes:
# - Contact-free (single body, VertexSdf.deactivate = 1): contact parameters kept.
# - The positive margin (DMIN) is set for consistency with the other scenes; it has no effect while VertexSdf
#   detection is off.
# - Budgets kept: the paper's ground-truth budgets, chosen to match Newton's behaviour
#   (accelerated-vbd-extras/parameters/gpu/beam.GroundTruth.Notes.txt).
# - The paper's BendingBeam.10MPa.GroundTruth.5Substeps (5 substeps of 20 AAAVBD / 500 VBD sweeps) is a variant
#   of this scene.

