#   rounded up to the next whole sweep, and never below the base budget (maintainer, 2026-11-12: equal time as
#   closely as possible; each subproblem still ends with the outer convergence test, so a budget that isn't a
#   multiple of the check interval only skips the inner check at its end). Calibration (7ce4082b): full
#   production runs, mean step time over sweeps per step, over the steps before a detected blow-up that ran
#   their full budget; fixed-budget kernels runs over the scene's busiest window, solve-scope busy time over
