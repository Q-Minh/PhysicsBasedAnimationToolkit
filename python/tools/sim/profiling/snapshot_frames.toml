# Snapshot frames of the paper's timelines (2026-11-16): per scene (the names of data/share and data/results), the
# 0-based frame indices N of its production trajectories, at t = N / rate seconds, and what each frame shows.
# The single source of truth for the snapshots: make_timelines.py reads it, and the placeholder snapshots are
# rendered at these frames. Renders are named <Scene>.Frame<N>.png.

[BasketOfFruit]
