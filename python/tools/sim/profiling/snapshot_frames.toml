# Snapshot frames of the paper's timelines (2026-11-16): per scene (the names of data/share and data/results), the
# 0-based frame indices N of its production trajectories (data/share/<Scene>/EqualSweep/<Scene>.<Solver>.h5, the
# same frames in every solver's), at t = N / rate seconds (times), and what each frame shows (notes).
# The single source of truth for the snapshots: make_timelines.py reads it, and the placeholder snapshots are
# rendered at these frames. Renders are named <Scene>.Frame<N>.png.

[BasketOfFruit]
rate = 60
frames = [24, 60, 108, 240, 468]
times = [0.400, 1.000, 1.800, 4.000, 7.800]  # seconds, frames / rate
notes = ["fruit falling onto the strands", "strands at their deepest", "rebound", "settling",
         "at rest in the basket"]

